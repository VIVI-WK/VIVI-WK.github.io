<style>
  :root{
    --ink:#1f2328; --sub:#5b6470; --line:#e2e5ea; --bg:#f4f6f8;

    --warn:#8a5a1f; --warn-soft:#fbf3e6; --red:#a23b3b; --red-soft:#f9ecec;
  }
  *{box-sizing:border-box;
    -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
    -webkit-touch-callout:none;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;
    color:var(--ink); background:var(--bg); line-height:1.75;
    -webkit-tap-highlight-color:transparent;
  }
  .wm{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.05;}
  .wm span{position:absolute;font-size:22px;color:#000;white-space:nowrap;
    transform:rotate(-30deg);font-weight:700;letter-spacing:2px;}
  .wrap{position:relative;z-index:1;max-width:800px;margin:0 auto;padding:24px 18px 60px;}
  header{text-align:center;margin-bottom:16px;}
  header .en{font-size:12px;letter-spacing:3px;color:var(--sub);}
  header h1{font-size:23px;margin:4px 0 6px;letter-spacing:1px;}
  header .meta{font-size:12px;color:var(--sub);}
  .search{width:100%;padding:12px 15px;border:1px solid var(--line);border-radius:10px;
    font-size:15px;font-family:inherit;margin-bottom:12px;background:#fff;}
  .search:focus{outline:none;border-color:var(--accent);}
  .nav{display:flex;gap:8px;margin-bottom:14px;min-height:20px;align-items:center;flex-wrap:wrap;}
  .navbtn{display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:13.5px;
    font-weight:700;color:var(--accent);padding:6px 12px;border:1px solid var(--line);
    background:var(--card);border-radius:8px;}
  .navbtn:hover{background:var(--accent-soft);}
  .crumb{font-size:12.5px;color:var(--sub);margin-left:2px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:22px 20px;box-shadow:0 2px 10px rgba(20,30,45,.04);}
  .q{font-size:17px;font-weight:700;margin:0 0 4px;}
  .hint{font-size:13px;color:var(--sub);margin:0 0 16px;}
  .opts{display:grid;gap:9px;}
  .opt{display:flex;align-items:center;gap:13px;padding:13px 15px;border:1px solid var(--line);
    border-radius:11px;cursor:pointer;background:#fff;transition:.12s;}
  .opt:hover{border-color:var(--accent);background:var(--accent-soft);}
  .opt .k{min-width:30px;height:28px;padding:0 6px;flex:0 0 auto;border-radius:8px;background:var(--accent-soft);
    color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
  .opt .col{display:flex;flex-direction:column;}
  .opt .t{font-weight:700;font-size:15px;}
  .opt .d{font-size:12px;color:var(--sub);}
  .rule{margin:16px 0 0;background:var(--red-soft);border-left:4px solid var(--red);
    padding:12px 15px;border-radius:0 8px 8px 0;font-size:13px;color:#4a2222;}
  .rule b{color:var(--red);}
  .rtag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);padding:4px 12px;border-radius:20px;margin-bottom:12px;}
  .result h2{font-size:19px;margin:0 0 4px;}
  .rsub{font-size:13.5px;color:var(--sub);margin:0 0 16px;}
  .fields{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);
    border-radius:11px;overflow:hidden;margin:4px 0;}
  .frow{display:grid;grid-template-columns:120px 1fr;background:#fff;}
  .fk{background:#f7f9fb;padding:12px 14px;font-size:13px;color:var(--sub);font-weight:700;
    border-right:1px solid var(--line);display:flex;align-items:center;}
  .fv{padding:12px 15px;font-size:15px;font-weight:700;}
  .fv small{display:block;font-weight:400;font-size:12px;color:var(--sub);margin-top:2px;}
  ol.steps{margin:6px 0;padding-left:0;counter-reset:s;list-style:none;}
  ol.steps li{position:relative;padding:9px 0 9px 40px;border-bottom:1px solid var(--line);font-size:14.5px;}
  ol.steps li:last-child{border-bottom:none;}
  ol.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:9px;
    width:26px;height:26px;background:var(--accent-soft);color:var(--accent);border-radius:7px;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
  ul.plain{margin:6px 0;padding-left:20px;font-size:14.5px;}
  ul.plain li{padding:3px 0;}
  .subh{font-size:13.5px;font-weight:700;color:var(--accent);margin:16px 0 4px;
    padding-bottom:4px;border-bottom:2px solid var(--accent-soft);}
  table.mini{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0;}
  table.mini th,table.mini td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top;}
  table.mini th{background:#f7f9fb;color:var(--sub);font-weight:700;}
  table.mini td:first-child{font-weight:700;}
  .note{margin-top:16px;background:var(--warn-soft);border-left:4px solid var(--warn);
    padding:12px 15px;border-radius:0 8px 8px 0;font-size:13.5px;color:#4a3a1a;}
  .note b{color:var(--warn);}
  .foot{text-align:center;margin-top:26px;font-size:11.5px;color:#9aa2ac;line-height:1.6;}
  .empty{color:var(--sub);font-size:14px;text-align:center;padding:20px;}
</style>
</head>

  r_overview:{tag:'現況總覽',title:'門市現況',blocks:[
    {h:'據點與輪班',list:['門市據點：內湖總公司、仁愛 NORMANN 概念店。','兩店隔週輪班；公司認知的「門市」為仁愛。','已取消統一客服專線，線上窗口為官方 LINE 與客服信箱 info@yaho.com.tw，門市以兩店各自專線為主。']},
    {h:'五大核心動線',list:['接待 → 報價 → 登打訂單 → 結帳 → 登打文中 ERP → 結單後出貨。','先把主線練熟；退換貨、調撥、盤點、吊牌、贈送、跨部門協作屬延伸，依實際遇到再補強。']},
    {h:'溝通管道',list:['對公司各部門以 Email 為主、Teams 即時聯繫；門市內部用 LINE 或 Email。','牽涉金額、出貨、退換貨、需留紀錄的通報，一律走 Email 以利查核。']},
    {h:'動態登打',list:['路徑：公司協同作業資料夾的「展售中心動態紀錄」。','需登打：客戶姓名、電話、Email、詢問品項、處理狀況；成交者加註訂單編號。電話格式不可有空格或橫槓。','未成交客戶一樣要打，並註明看了什麼商品、有沒有報價。','動態當下就要打；已成交當下沒打的，最遲成交日起七日內補登；沒成交的當日就要補上。逾期未補登，客戶就不是你的，事後不得追討。','動態要有效，前提是真的服務過：須有實質互動、報價紀錄或對話證明；僅 LINE 綁定或只登記姓名電話視為無效。']}]},

  r_recept_retail:{tag:'接待 ・ 一般/零售客戶',list:['產品介紹：操作解說、人體工學概念、品牌故事。','提供當前活動資訊與優惠。','協助路線導航與來店預約。']},
  r_recept_call:{tag:'接待 ・ 來電客戶',list:['處理客戶問題、維修詢問、客訴。','售後服務以線上操作流程教學為主，可錄影、加 LINE、傳 Email 輔助。']},
  r_recept_designer:{tag:'接待 ・ 設計師',list:['請客戶提供設計師名片，交業助建檔，建檔完成再建入 ERP。','不定時提供新品 EDM 與活動資訊給設計師，並藉此更新動態。','設計師帶業主來店，若對方主動告知已有總公司同仁接洽過，留下客戶姓名電話，於「雅浩家具-專案」LINE 群組確認由業務部或專案部哪位接洽。']},
  r_recept_corp:{tag:'接待 ・ 企業客戶',list:['協助試坐指導，門市端僅做基本介紹。','未合作過的企業客戶：門市業務先接洽、詢問採購數量後向 Stanley 報價；若 Stanley 告知已有業務接洽，由原業務承接，不重複報價。','已有合作紀錄的企業大單：直接轉接 Stanley。']},
  r_recept_boss:{tag:'接待 ・ 老闆朋友',list:['與老闆確認後再接待與報價。','若涉及贈送，依「商品贈送」流程辦理。']},

  r_quote_types:{tag:'報價 ・ 各類報價要點',list:['一般客戶：以現貨及官網商品為主，依 Airtable 報價，折扣依固定表或請 Stanley 確認。','專案報價：依數量需求先自行換算，折扣與專案處理請 Stanley 確認；客製或特殊商品須確認交期與是否可進台灣。','設計師報價：成立設計師與業主兩份；留意業主端是否另有業務先接到。','企業客戶：接洽流程見「接待 ・ 企業客戶」。','維修報價：由客服部提供零件資訊與報價；客戶嫌貴想改購新品，客服部會轉回門市接洽。','官網：說明商品資訊與活動，提供推薦碼填寫。'],

  r_order_common:{tag:'訂單登打 ・ 共通規則',list:['下單前務必查庫存，避免超賣。','每筆訂單單獨成立一封 Email，主旨依狀態加訂單編號：訂單成立-編號、訂單出貨-編號、訂單對帳-編號、訂單退貨-編號、訂單型號更改-編號、訂單備註更改-編號。','訂貨的價格與型號皆須由第二人確認。']},
  r_order_instock:{tag:'商品登打 ・ 現貨',steps:['確認產品價格、型號、庫存。','與客戶確認出貨時間。','登打文中 ERP，並 Email 訂單給相關部門。']},
  r_order_purchase:{tag:'商品登打 ・ 訂貨',list:['價格與型號：由產品部確認後，門市須由第二人再次確認。','可否訂貨：由採購部確認可否單獨訂貨、可否進到台灣。','預估交期：由採購部確認後，門市於訂單說明預計交期。']},
  r_order_future:{tag:'商品登打 ・ 期貨',list:['確認新店倉庫表是否已訂貨，於訂單說明預計到貨日。','確認預計到貨數量並於訂單載明。']},
  r_order_display:{tag:'商品登打 ・ 展品',blocks:[
    {h:'登打要點',list:['型號：無型號則 Email 相關部門查詢，型號先列待補。','價格：有價格標為展品價；無價格 Email 查詢。','保固：確認保固並於訂單備註說明。','運送：自運確認自取時間並請客戶簽收；貨運依公司流程出貨。','庫存售完通報行銷部與客服部；官網如有上架需下架。']},

    note:'實體店試坐下單<b>無七天鑑賞期</b>，銷售當下務必告知；展品售出當下立即更新盤點表。'},
  r_order_sale:{tag:'商品登打 ・ 特賣品',list:['確認價格：有價格標為特賣價；無價格 Email 查詢。','確認庫存並更新盤點。','特賣狀況如實告知客戶，保固時間於訂單備註。','運送同展品：自運親簽、貨運安排出貨。']},
  r_order_repair:{tag:'商品登打 ・ 維修',list:['維修方式：自運或貨運配送。','訂貨流程：區分現貨零件與需訂貨零件。']},
  r_order_web:{tag:'官網金額組合下單',blocks:[
    {h:'客戶下單流程',steps:['引導客戶至官網下單，協助確認商品與金額組合。','於官網「訂單備註」與「商家備註」兩欄同時填規格/型號與出貨時間（切勿填在物流訊息處），兩欄內容需一致。','商家備註為僅商家可見欄位，客戶事後改訂單備註，商家備註仍保有原始紀錄佐證。','依官網訂單備註欄位順序編號，切勿跳號；上一筆未完成付款可先跳號，付款成功後由負責窗口依序補回。','確認編號後自行登打文中：請款客戶打順立智慧、業務打官網-xxx、工地部門打總公司-業務。']},
    {h:'重要規則',list:['此類官網訂單拋單仍由後勤處理，門市需自行登打文中。','門市不得在文中成立、客服已拋單後又直接改官網備註，以免資訊落差。','出貨時間變更一律 Email 通知客服部，客服僅依 Email 更新。']}]},
  r_erp_fields:{tag:'文中 ・ 欄位與簡化原則',blocks:[
    {h:'欄位邏輯',list:['請款客戶：付款的人，誰付款打在此欄。','客戶：訂購人，這筆訂單掛在誰名下；系統用此欄客工商建檔資料出貨。','付款人與訂購人同一人（一般散客）兩欄可建同一人。','另有收貨人、聯絡人，務必在訂單備註說明關聯。','訂購人與收貨人不同（設計師訂、業主收）：文中備註資料分頁填實際出貨地址。','保固人與訂購人不同（設計師代訂業主保固）：另建業主客工商，備註「保固人：業主 XXX」。','金額一律未稅價（退佣訂單除外）。']},
    {h:'客工商建檔',list:['客工商欄位不直接綁業務員，只有打訂單時才登打所屬業務。','查到顧客資料卻無權限：通知客服部移除該客戶的業務員後即可使用。']},

    note:'不同來源的三欄打法完全不同，詳見「文中三欄怎麼填」與情境對照表。'},
  r_erp_close:{tag:'文中 ・ 關帳與修改規則',list:['文中登打完成會自動關帳。','當月訂單因客戶臨時改出貨時間或地址錯誤：直接改訂單正本並 Email 通報，不須請會計刪單；地址錯誤務必同時到客供商改正確地址。','非當月訂單需修改，才需請會計部開啟文中。','任何文中金額變動，一律通知會計部。','客戶名稱有特殊字，請會計部於文中協助造字。','訂單維護區「結案」欄位顯示 1 或 2 時不能直接改，須先通知會計部開啟文中，否則影響結帳。判別方式由主管或資深同仁協助。']},

  r_pay_onsite:{tag:'結帳 ・ 付款（現場）',list:['刷卡：刷清於訂單註明刷卡銀行；分期註明銀行及期數。','現金：付清註明付清金額；訂金或尾款各自註明金額。','其他（匯款、跑流程等）：於訂單註明付款方式。']},

  r_pay_pre:{tag:'結帳 ・ 未付款先出貨',steps:['先確認客戶付款流程與背景，提供資訊請公司審核。','訂單需由「會計部主管」簽名審核同意後才能成立。','同一客戶限最多 2 筆未收款訂單；超過須先結清前單。'],
    note:'必須走完三步驟，且同一客戶<b>限定最多 2 筆</b>。'},
  r_invoice:{tag:'結帳 ・ 開立發票',blocks:[
    {h:'開立方式',list:['現場客戶：確認品名、日期、金額；三聯式確認抬頭統編；確認開立金額（訂金/尾款/全額）；Email 通知會計部開立並郵寄；完成於訂單註明發票號碼。','已付款非現場客戶：確認郵寄地址、三聯式抬頭統編需同匯款人資訊、開立金額，訂單備註後 Email 請會計開立。','未付款先開立：依「未付款先出貨」流程，需會計部主管於訂單簽名同意，再 Email 請會計開立並郵寄。']},
    {h:'補充規範',list:['發票本統一於內湖總公司，門市現場結帳客戶也由會計代開並郵寄。','一張訂單一張發票。','個人名義支付可開三聯或二聯；公司戶支付時匯款公司名稱與統編需同發票一致。','發票更換需於發票日之次月 7 日前將舊發票交會計部，逾期不受理。','多張訂單對應多張發票需合理拆分：單一品項數量不可拆；金額需與文中一致，不可為配合客戶而改文中金額造成毛利為負。','發票品名與備註清楚寫在格內，勿覆蓋重疊。']}]},

  web_before:{tag:'官網取消 ・ 未出貨',sub:'官網未結案前，客戶於後台自行取消（門市已與客戶再確認）',
    steps:['與客戶再次確認取消意願，請客戶於 LINE 或 Email 留書面確認並截圖存底。','先給門市經理簽核：列印官網訂單，註明取消原因與確認日期，請經理簽名。未簽核前不做後續動作。','業務至文中訂單備註：註明「客戶於未出貨前要求取消訂單」＋客戶確認日期。','Email 通知客服部：客戶已於官網後台取消，請勿安排出貨。','Email 通知會計部：文中該筆未出貨、已備註取消，請留意。（步驟 4、5 同時發）'],
    note:'退款與電子發票由官網後台退刷時系統自動處理，<b>門市不需另行作業</b>。'},

  before_ship:{tag:'退換貨 ・ 出貨前',sub:'商品尚未出貨（退貨、換貨共通）',
    steps:['先給門市經理簽核：訂單寫清楚退換原因請經理簽名，未簽核前不發通知。','簽核後馬上發信客服部：更新訂單並通報，請客服部取消出貨。','同時發信會計部：更新訂單並通報，請會計部開啟文中告知需修改內容。（2、3 同時發）']},
  return_after:{tag:'退貨 ・ 出貨後',sub:'商品已出，客戶要退貨',
    steps:['先給門市經理簽核（未簽核前不發通知）。','簽核後同時發信客服部＋會計部：客服準備收貨、會計知道金額會改。','確認商品狀況（瑕疵）：確認包材、約收回時間、與客服確認可否當天收送；拍瑕疵照連訂單發採購／客服／工程。','訂製商品：等採購與原廠確認維修狀況再安排取回；原廠無法回覆則與經理確認去留再修訂單。','商品收回倉庫後，客服會把單據貼「雅浩門市工程部」LINE 群組；看到自己單據後在群組請工程檢查。包材不完整要跟客戶收包材費。','主動追蹤檢查進度（工程常外出，隔幾天沒消息就群組問或打電話）。瑕疵請業務協助跟客戶協商。','工程確認沒問題、退款金額確定後，Email 給會計＋工程：告知檢查完畢、退多少、訂單改成什麼；文中不能直接改的請會計開文中。'],
    note:'<b>退款要等三樣到齊</b>：發票收回＋商品收回檢查無誤＋訂單改好通知完，客戶催也不行。'},
  exchange_after:{tag:'換貨 ・ 出貨後',sub:'商品已出，客戶要換別的款',
    steps:['先給門市經理簽核（未簽核前不發通知）。','簽核後同時發信客服部＋會計部：客服準備收貨與送貨、會計知道金額會改。','確認包材：不完整要跟客戶收包材費。','約客戶收回時間；商品收回倉庫後在「雅浩門市工程部」群組依客服單據請工程檢查並追蹤；工程確認沒問題才能換新款。','跟客戶確認換貨金額：換貴的補多少、換便宜退多少。','跟客服部確認新品何時送。','訂製商品換貨：拍瑕疵照連訂單發採購／客服／工程，再約取回時間。','金額確定後再發一次信給會計部：最後換成什麼、差額多少；文中不能直接改的請會計開文中。'],

    {h:'仁愛概念店調撥提醒',list:['有調撥務必更新盤點。','每月 5 號以前繳交盤點表。','業助會查門市盤點表回報老闆，老闆客戶也可能臨時來店，務必保持盤點更新。']}]},
  r_inventory_flow:{tag:'盤點 ・ 流程',list:['每月定期盤點，分類抽籤；品項分 A、B 兩類，每人每月輪替 A 或 B。','點貨確認：型號、數量、定價、編號、出廠日期、商品狀況與瑕疵。','展品損壞：提供出廠貼紙與損壞位置拍照，Email 通報門市部、客服部、採購部協助申請原廠維修，更新盤點並備註報修日期。','當月 30 日前完成盤點。']},
  r_inventory_cols:{tag:'盤點 ・ 盤點表欄位',list:['圖片、門市編號、數量、商品型號、商品說明、訂價、商品狀況、出廠日期、備註。']},

  r_open:{tag:'門市日常 ・ 開店檢查',list:['開啟所有電源、冷氣、空調、展示燈具，開電視播放影片。','檢查當天需調撥品項是否準備完成。','將前一日訂單正本提交會計部。','巡視門市環境有無髒污，桌椅排整齊。','茶水間、展區、廁所定期清潔消毒、換垃圾袋。']},

  r_maint:{tag:'門市日常 ・ 環境維護',list:['展間：試坐區椅子歸位、桌子排正；展品陳列與立牌位置正確；酒精等耗材補充；電器使用控管。','零件備貨：輪子、頭枕、腳踏墊、散熱架、椅套；氣泡袋、空紙箱、裝箱袋、綑綁繩、膠帶。','茶水間：咖啡膠囊補充與回收、擦手紙與衛生紙補充、抹布定期替換、水槽與杯子清潔歸位。','留意展間散落的已售出價格牌，務必歸位。']},

  r_dress:{tag:'門市日常 ・ 服裝與班務',list:['穿著正式服裝，不可著拖鞋。','依排班時間各自到內湖及仁愛上班。','每月 25 日前完成下月排班表，更新於公檔排班資料區（路徑：S:\\部門資料夾\\5100-北區展售中心\\門市休假表）。']},

  r_gift_person:{tag:'商品贈送 ・ 送個人朋友',steps:['開單前先向老闆要受贈人真實姓名、身分證字號、戶籍地址三項資料。','老闆無法提供完整資料：告知「依公司財會規範無法成立此單」，不省略個資。','拿到完整資料後，用門市訂購單成立贈品訂單（金額為 0 或標註贈品）。','訂單必須由老闆親自簽名才能成立。','Email 通知客服部、會計部、採購部、門市部，告知贈品訂單已成立並安排配送。']},
  r_gift_company:{tag:'商品贈送 ・ 送公司行號',steps:['開單前先向老闆要受贈單位公司名稱、統一編號兩項資料。','老闆無法提供完整資料：同樣告知無法成立，不省略資料。','拿到完整資料後，用門市訂購單成立贈品訂單。','訂單必須由老闆親自簽名才能成立。','Email 通知客服部、會計部、採購部、門市部，安排配送。']},
  r_gift_sign:{tag:'商品贈送 ・ 簽名與歸檔',list:['贈品訂單必須由老闆親自簽名才能成立。','簽名訂單保留正本給會計部，並掃描留底備查。','贈品訂單不需打文中，也不需成立訂單編號。'],

  r_reserve_flow:{tag:'商品保留 ・ 依來源的流程',list:['新店倉、電商外站：提供型號數量、保留對象、期限，LINE 通知客服部。','官網：已成交於官網備註說明成交訂單；保留中於官網備註說明對象與期限並自行下單。現貨官網上架商品一律先下單為原則。','專案保留的現貨：先跟專案部確認釋放數量，再通知客服部，並說明挪哪個業務的。','仁愛概念店：自行於官網下單、官網備註對象期限、更新仁愛庫存表備註，再 Email 通知客服部扣庫存並通知行銷部下架。','內湖、白天鵝、其他：Email 通知客服部、門市部、行銷部對象與期限；已上架需 Email 通知避免重新上架。','已售出：Email 通知門市部、客服部、行銷部成交訂單編號；取消保留：Email 通知可重新上架。']},
  r_reserve_notify:{tag:'商品保留 ・ 通知與期限',list:['保留通知以「雅浩-客服/倉儲/門市/訂單部」LINE 群組為主；涉及上下架才用 Email。','保留期限：現貨與預購 14 天，展品 7 天。','延長僅可一次、最長 14 天；已逾期後才申請延長者視為無效保留，優先釋放給下一位。']},
  r_reserve_dispute:{tag:'商品保留 ・ 爭議判定',list:['未依流程先行保留就銷售，視同未保留完成。','相同商品保留依流程正確性與時間判定；流程有誤者，即使最早留言仍視為無效。','保留未於期限內取消或未發信延後，視同取消直接釋放。','延長保留依當初方式通知（LINE 就 LINE、MAIL 就 MAIL），避免影響上下架判斷。']},

  a_basic:{tag:'業績歸屬 ・ 判定基準',sub:'客戶未綁定指定業務時的基本判定',
    list:['業績歸屬以客戶「實際到店當天」值班業務為準，不是電話預約當天。','例：客人預約 3/5 到內湖，就算 3/5 當天內湖值班業務的。','一切以「動態」為主；動態要註明客戶姓名＋電話才具舉證效力。','動態當下就要打；成交當下沒打的最遲成交日起七日內補登（以檔案存檔紀錄為準），逾期未補登不得事後追討。','依公告制度執行，不以個人解讀為準。有疑慮當下在群組提出；事後才爭議，一律門市經理處理。'],

  a_bind:{tag:'業績歸屬 ・ 有效綁定',sub:'什麼情況客戶算你的',sub2:'算你的（至少符合一種）',

    sub3:'不算你的（到店成交歸現場接待）',
    list2:['客戶說不認識你，你動態沒寫、對話紀錄也拿不出來。','只單方面傳訊息或丟報價，客戶從來沒回過。','系統上只登記名字電話，沒動態、沒任何講過話的證明。'],

/* =================== 導覽與繪製 =================== */
let stack=['home'];
const CRUMB={recept:'接待',quote:'報價',order:'訂單登打',cols:'三欄填法',cols_web:'官網',
  designer:'設計師代訂',order_types:'各類商品',checkout:'結帳發票',post:'結單後',
  return:'退換貨',ret_web:'官網取消',ret_return:'退貨',ret_exchange:'換貨',stock:'調撥盤點吊牌',
  daily:'門市日常',gift:'商品贈送',reserve:'商品保留',attr:'業績歸屬',product:'商品知識',contacts:'通訊錄'};
function labelOf(s){
  if(s.startsWith('res:')) return RES[s.slice(4)]?RES[s.slice(4)].tag:'結果';
  if(s.startsWith('search:')) return '搜尋「'+s.slice(7)+'」';
  return CRUMB[s]||s;
}
/* 把手機／瀏覽器的返回鍵也接進導覽：每次前進就在瀏覽器歷程記一筆，按返回就回到上一頁查詢 */
var histOK=false;
try{history.replaceState({s:['home']},'');histOK=true;}catch(e){histOK=false;}
function pushHist(){if(histOK){try{history.pushState({s:stack.slice()},'');}catch(e){}}}
function replaceHist(){if(histOK){try{history.replaceState({s:stack.slice()},'');}catch(e){}}}
function go(id){stack.push(id);pushHist();draw();}
function showRes(id){stack.push('res:'+id);pushHist();draw();}
function back(){if(histOK){history.back();}else if(stack.length>1){stack.pop();draw();}}
function home(){stack=['home'];pushHist();draw();}
if(histOK)window.addEventListener('popstate',function(e){
  stack=(e.state&&e.state.s)?e.state.s.slice():['home'];draw();});

function draw(){
  const cur=stack[stack.length-1];
  const nav=document.getElementById('nav');
  if(stack.length>1){
    const crumbs=stack.slice(1).map(labelOf).join(' ／ ');
    nav.innerHTML='<span class="navbtn" onclick="home()">⌂ 首頁</span>'
      +'<span class="navbtn" onclick="back()">‹ 上一步</span>'
      +'<span class="crumb">'+crumbs+'</span>';
  } else nav.innerHTML='';
  /* 同步搜尋框：離開搜尋狀態就清空；回到搜尋狀態且框是空的（例如按上一步回來）就把關鍵字帶回來 */
  const sb=document.getElementById('search');
  if(cur.startsWith('search:')){ if(!sb.value) sb.value=cur.slice(7); }
  else if(sb.value) sb.value='';
  if(cur.startsWith('res:')) drawResult(cur.slice(4));
  else if(cur.startsWith('search:')) drawSearch(cur.slice(7));
  else drawNode(cur);
}
function drawNode(id){
  const n=NODES[id];let h='<div class="card">';
  h+='<p class="q">'+(n.title||n.q)+'</p>';
  if(n.hint) h+='<p class="hint">'+n.hint+'</p>';
  h+='<div class="opts">';
  n.opts.forEach(o=>{
    const act=o.to?"go('"+o.to+"')":"showRes('"+o.res+"')";
    h+='<div class="opt" onclick="'+act+'"><div class="k">'+o.k+'</div>'
      +'<div class="col"><span class="t">'+o.t+'</span>'+(o.d?'<span class="d">'+o.d+'</span>':'')+'</div></div>';
  });
  h+='</div>';
  if(n.rule) h+='<div class="rule">'+n.rule+'</div>';
  h+='</div>';
  document.getElementById('stage').innerHTML=h;
}
function blockHtml(b){
  let h='';
  if(b.h) h+='<div class="subh">'+b.h+'</div>';
  if(b.fields){h+='<div class="fields">';b.fields.forEach(f=>{h+='<div class="frow"><div class="fk">'+f[0]+'</div><div class="fv">'+f[1]+(f[2]?'<small>'+f[2]+'</small>':'')+'</div></div>';});h+='</div>';}
  if(b.steps){h+='<ol class="steps">';b.steps.forEach(s=>h+='<li>'+s+'</li>');h+='</ol>';}
  if(b.list){h+='<ul class="plain">';b.list.forEach(s=>h+='<li>'+s+'</li>');h+='</ul>';}
  if(b.table){h+='<table class="mini"><tr>';b.table.head.forEach(c=>h+='<th>'+c+'</th>');h+='</tr>';
    b.table.rows.forEach(r=>{h+='<tr>';r.forEach(c=>h+='<td>'+c+'</td>');h+='</tr>';});h+='</table>';}
  return h;
}
function drawResult(id){
  const r=RES[id];let h='<div class="card result"><span class="rtag">'+r.tag+'</span>';
  h+='<h2>'+(r.title||(r.fields?'照這樣填':r.steps?'照這樣做':'重點整理'))+'</h2>';
  if(r.sub) h+='<p class="rsub">'+r.sub+'</p>';
  if(r.fields) h+=blockHtml({fields:r.fields});
  if(r.steps) h+=blockHtml({steps:r.steps});
  if(r.sub2) h+='<div class="subh">'+r.sub2+'</div>';
  if(r.list) h+=blockHtml({list:r.list});
  if(r.sub3) h+='<div class="subh">'+r.sub3+'</div>';
  if(r.list2) h+=blockHtml({list:r.list2});
  if(r.table) h+=blockHtml({table:r.table});
  if(r.blocks) r.blocks.forEach(b=>h+=blockHtml(b));
  if(r.note) h+='<div class="note"><b>注意</b>　'+r.note+'</div>';
  h+='</div>';
  document.getElementById('stage').innerHTML=h;
}

/* =================== 搜尋 =================== */
function textOf(r){
  let t=(r.tag||'')+' '+(r.title||'')+' '+(r.sub||'')+' '+(r.sub2||'')+' '+(r.sub3||'');
  if(r.fields)r.fields.forEach(f=>t+=' '+f.join(' '));
  if(r.steps)t+=' '+r.steps.join(' ');
  if(r.list)t+=' '+r.list.join(' ');
  if(r.list2)t+=' '+r.list2.join(' ');
  if(r.note)t+=' '+r.note;
  if(r.table){t+=' '+r.table.head.join(' ');r.table.rows.forEach(row=>t+=' '+row.join(' '));}
  if(r.blocks)r.blocks.forEach(b=>{t+=' '+(b.h||'');if(b.list)t+=' '+b.list.join(' ');if(b.steps)t+=' '+b.steps.join(' ');if(b.table){t+=' '+b.table.head.join(' ');b.table.rows.forEach(row=>t+=' '+row.join(' '));}if(b.fields)b.fields.forEach(f=>t+=' '+f.join(' '));});
  return t;
}
/* 搜尋改為導覽堆疊的一個狀態（search:關鍵字），按上一步能回到搜尋結果、再回到原本選單 */
function doSearch(q){
  q=q.trim();
  const top=stack[stack.length-1];
  if(!q){
    if(top.startsWith('search:')){ if(histOK){history.back();return;} stack.pop(); }
    draw();return;
  }
  if(top.startsWith('search:')){stack[stack.length-1]='search:'+q;replaceHist();}
  else {stack.push('search:'+q);pushHist();}
  draw();
}
function drawSearch(q){
  const hits=[];
  for(const id in RES){if(textOf(RES[id]).indexOf(q)>=0)hits.push(id);}
  let h='<div class="card"><p class="q">搜尋「'+q+'」</p>';
  if(!hits.length){h+='<p class="empty">沒有找到，換個關鍵字試試（例如：退款、發票、盤點、綁定、贈送）。</p></div>';
    document.getElementById('stage').innerHTML=h;return;}
  h+='<p class="hint">找到 '+hits.length+' 筆，點進去看。</p><div class="opts">';
  hits.forEach(id=>{h+='<div class="opt" onclick="showRes(\''+id+'\')"><div class="k">›</div>'
    +'<div class="col"><span class="t">'+RES[id].tag+'</span>'+(RES[id].sub?'<span class="d">'+RES[id].sub+'</span>':'')+'</div></div>';});
  h+='</div></div>';
  document.getElementById('stage').innerHTML=h;
}
draw();
